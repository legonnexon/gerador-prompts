<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de prompts + ComfyUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceaf0;--card:#ffffff;--raise:#f4f2f7;--line:#dcd7e3;--fg:#1d1926;--mut:#6b6477;--or:#ff7a1a;--or2:#d95a00;--tint:color-mix(in srgb,var(--or) 14%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121a;--card:#1e1a26;--raise:#2a2433;--line:#3a3346;--fg:#f0ebf4;--mut:#a89fb5;--or2:#ff9a4d}}
:root[data-theme="dark"]{--bg:#15121a;--card:#1e1a26;--raise:#2a2433;--line:#3a3346;--fg:#f0ebf4;--mut:#a89fb5;--or2:#ff9a4d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
button,select,input,textarea{font-family:inherit}
.app{display:grid;grid-template-columns:372px minmax(0,1fr);min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px}
h1{margin:0;font:700 21px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;text-decoration:none;padding:6px 8px;border-radius:8px}
.nav:hover{background:var(--raise);color:var(--fg)}
.scroll{overflow:auto;flex:1;padding:0 18px 18px}
details{border-top:1px solid var(--line)}
summary{display:flex;align-items:center;gap:8px;padding:14px 0;font-weight:700;font-size:15px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary iconify-icon{color:var(--or2)}
summary .chev{margin-left:auto;color:var(--mut);transition:transform .15s}
details[open] summary .chev{transform:rotate(180deg)}
details>.in{padding-bottom:16px}
summary:focus-visible,.nav:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-radius:8px}
.lb{display:block;margin:14px 0 6px;color:var(--mut);font-size:13px}
.in>.lb:first-child{margin-top:0}
.mode{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mode button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--fg);font-size:12px;cursor:pointer}
.mode button[aria-pressed="true"],.pair button[aria-pressed="true"],.spd button[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--or);background:var(--tint);color:var(--or2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{color:var(--mut);font-size:13px}
select,#url{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--fg);font-size:14px}
select:disabled{opacity:.5}
.ck{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--fg);font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--or2);flex:none;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--fg);font:600 14px "Yu Gothic","Hiragino Sans","Noto Sans JP","Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
#lfile{display:block;margin-top:8px;font:12px ui-monospace,Consolas,monospace;color:var(--mut);word-break:break-all}
.spd,.pair{display:flex;gap:6px}
.spd button,.pair button{flex:1;height:52px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty button{font:700 16px "Bricolage Grotesque",system-ui,sans-serif}
.mode button:focus-visible,.pair button:focus-visible,.spd button:focus-visible,.seg button:focus-visible,#gen:focus-visible,#send:focus-visible,#clr:focus-visible,.ibtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.dock{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);display:grid;gap:8px}
#gen{display:block;width:100%;height:60px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--or),#e85f00);color:#fff;font:800 22px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 5px 0 #b04800;transition:transform .08s,box-shadow .08s}
#gen:active{transform:translateY(4px);box-shadow:0 1px 0 #b04800}
#send{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--fg);font:600 15px "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
#send[hidden]{display:none}
#send:hover{border-color:var(--or)}
.stage{padding:20px 24px 40px;min-width:0}
.bar{display:flex;align-items:center;gap:12px;min-height:40px;margin-bottom:14px}
#st{margin:0;flex:1;font-size:14px;color:var(--mut)}
#clr{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
#clr:hover{border-color:var(--or)}
#out{display:none;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ohead{display:flex;align-items:center;gap:10px}
#theme{margin:0;flex:1;color:var(--mut);font-size:14px}
.ibtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--fg);cursor:pointer}
.ibtn[aria-pressed="true"]{border-color:var(--or);color:var(--or2)}
#txt{display:block;width:100%;min-height:240px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:14px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
#txt[hidden]{display:none}
.fv{position:absolute;top:6px;left:6px;z-index:2;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fv:hover{background:rgba(0,0,0,.8)}
.fv[aria-pressed="true"]{color:#ffb020}
.fv:focus-visible{outline:2px solid #fff;outline-offset:1px}
#flist{display:grid;gap:6px;max-height:300px;overflow:auto}
.fi{display:flex;align-items:stretch;gap:4px}
.fsel{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--fg);text-align:left;cursor:pointer;font-size:14px}
.fsel[aria-pressed="true"]{border-color:var(--or);background:var(--tint)}
.fsel img,.fsel .ph{width:36px;height:48px;flex:none;border-radius:6px;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.fsel span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .sm{width:34px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fi .sm:hover{color:var(--fg);border-color:var(--fg)}
.fsel:focus-visible,.fi .sm:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.cfgw{position:relative}
.gear{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
.gear:hover{border-color:var(--or)}
.gear:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#pop{position:absolute;top:48px;right:0;z-index:60;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
#pop[hidden]{display:none}
.pt{margin:0 0 4px;font-weight:700}
.hint{margin:8px 0 0;font-size:13px;color:var(--mut)}
#res{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-items:start}
#res:empty::before{content:"As imagens aparecem aqui. Gere um prompt e envie ao ComfyUI.";grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:42vh;padding:24px;border:1px dashed var(--line);border-radius:16px;color:var(--mut);text-align:center}
.sk{width:100%;aspect-ratio:832/1216;border-radius:10px;background:linear-gradient(100deg,var(--line) 30%,color-mix(in srgb,var(--line),#fff 45%) 50%,var(--line) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.card{position:relative;aspect-ratio:832/1216;border-radius:10px;overflow:hidden}
.card .sk{height:100%;aspect-ratio:auto;border-radius:0}
.card a{display:block;height:100%}
.card img{height:100%;object-fit:cover}
.x{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font:16px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.up{display:flex;align-items:center;gap:5px;position:absolute;bottom:6px;right:6px;z-index:2;padding:4px 10px;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:600 12px system-ui,sans-serif;cursor:pointer}
.up.cp{right:auto;left:6px}
.up:hover{background:rgba(0,0,0,.8)}
.up:focus-visible{outline:2px solid #fff;outline-offset:1px}
.x:hover{background:rgba(0,0,0,.8)}
.x:focus-visible{outline:2px solid #fff;outline-offset:1px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}#res img{animation:none}}
#res img{display:block;width:100%;border-radius:10px;animation:fi .4s}
#viewer{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.94);overflow:hidden;touch-action:none}
#viewer[hidden]{display:none}
#viewer img{max-width:100vw;max-height:100vh;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none;cursor:grab;will-change:transform}
#viewer.pan img{cursor:grabbing}
.vbtn{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.vbtn:hover{background:rgba(255,255,255,.28)}
.vbtn:focus-visible,.vact button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.vbtn[hidden]{display:none}
#vx{top:12px;right:12px}#vp{left:12px;top:50%;margin-top:-22px}#vn{right:12px;top:50%;margin-top:-22px}
.vact{position:absolute;z-index:2;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.vact button{display:flex;align-items:center;gap:6px;padding:9px 16px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:600 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.vact button:hover{background:rgba(255,255,255,.3)}
.card a{cursor:zoom-in}
@media (max-width:859px){
.app{display:block}
aside{position:static;height:auto;border-right:0}
.scroll{overflow:visible}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;grid-template-columns:1fr auto;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
#gen{height:54px;font-size:20px}
#send{width:auto;padding:0 16px;height:54px}
.stage{padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
#res{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
#neg{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--fg);resize:vertical;font:13px/1.5 ui-monospace,Consolas,monospace}
#neg:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.act{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.act button{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.act button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.sl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sl output{font:600 13px ui-monospace,Consolas,monospace;color:var(--or2)}
input[type=range]{width:100%;accent-color:var(--or);margin:2px 0 10px}
</style>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
<div class="app">
<aside>
<div class="brand"><h1>Gerador de prompts</h1><a class="nav" href="jogo.html"><iconify-icon icon="lucide:gamepad-2" width="18" height="18"></iconify-icon>Jogo</a></div>
<div class="scroll">
<details open><summary><iconify-icon icon="lucide:user-round" width="18" height="18"></iconify-icon>Personagem<iconify-icon class="chev" icon="lucide:chevron-down" width="18" height="18"></iconify-icon></summary><div class="in">
<div class="mode" role="group" aria-label="Personagem">
<button data-m="girl" aria-pressed="true" aria-label="1girl" title="1girl"><iconify-icon icon="lucide:venus" width="24" height="24"></iconify-icon>Garota</button>
<button data-m="boy" aria-pressed="false" aria-label="1boy" title="1boy"><iconify-icon icon="lucide:mars" width="24" height="24"></iconify-icon>Garoto</button>
<button data-m="rand" aria-pressed="false" aria-label="Aleatório" title="Aleatório"><iconify-icon icon="lucide:shuffle" width="24" height="24"></iconify-icon>Sorteio</button>
<button data-m="fav" aria-pressed="false" aria-label="Favorita" title="Personagem favorita"><iconify-icon icon="lucide:star" width="24" height="24"></iconify-icon>Favorita</button>
</div>
<div id="favp" hidden>
<span class="lb">Favoritas</span>
<div id="flist"></div>
<label class="ck"><input type="checkbox" id="fkeep">Manter a roupa salva</label>
<label class="ck"><input type="checkbox" id="fseed">Usar o LoRA e as seeds salvos</label>
</div>
<div class="duo"><div class="fld"><label for="race">Raça</label><select id="race"><option value="">Sem raça (sorteio)</option><option value="fox">Fox</option><option value="angel">Angel</option><option value="dragon">Dragon</option><option value="elf">Elf</option><option value="demon">Demon</option><option value="wolf">Wolf</option><option value="horse">Horse</option><option value="oni">Oni</option><option value="fairy">Fairy</option><option value="tiger">Tiger</option></select></div><div class="fld"><label for="scene">Cenário</label><select id="scene"><option value="">Sorteio</option><option value="free">Livre (todas as tags)</option></select></div></div>
<div class="fld" style="margin-top:12px"><label for="frame">Enquadramento</label><select id="frame"><option value="">Sorteio</option><option value="portrait">Retrato (portrait)</option><option value="upper">Retrato (upper body)</option><option value="both">Retrato (portrait + upper body)</option><option value="cowboy">Cowboy shot</option><option value="full">Corpo inteiro</option><option value="bg">Só o fundo (sem personagem)</option></select></div>
<label class="ck"><input type="checkbox" id="match" checked>Roupa combinando com o cenário</label>
</div></details>
<details open><summary><iconify-icon icon="lucide:palette" width="18" height="18"></iconify-icon>Estilo<iconify-icon class="chev" icon="lucide:chevron-down" width="18" height="18"></iconify-icon></summary><div class="in">
<div class="seg" role="group" aria-label="LoRA"><button data-l="0" aria-pressed="true">AIイラストおじさん</button><button data-l="1" aria-pressed="false">Takorin Style</button><button data-l="2" aria-pressed="false">Hata4564</button><button data-l="3" aria-pressed="false">Niji Oil</button><button data-l="4" aria-pressed="false">Niji Semi-realism</button><button data-l="5" aria-pressed="false">USNR Style</button></div>
<span id="lfile"></span>
<div class="sl"><label class="ck"><input type="checkbox" id="sb" checked>Smooth Booster</label><output id="sbo">0.50</output></div>
<input type="range" id="sbs" min="0" max="1.5" step="0.05" value="0.5" aria-label="Força do Smooth Booster">
<div class="sl"><label class="ck"><input type="checkbox" id="dl" checked>Dramatic Lighting</label><output id="dlo">0.80</output></div>
<input type="range" id="dls" min="0" max="1.5" step="0.05" value="0.8" aria-label="Força do Dramatic Lighting">
</div></details>
<details open><summary><iconify-icon icon="lucide:image" width="18" height="18"></iconify-icon>Saída<iconify-icon class="chev" icon="lucide:chevron-down" width="18" height="18"></iconify-icon></summary><div class="in">
<span class="lb" id="fml">Formato</span>
<input type="hidden" id="fmt" value="p">
<div class="pair fmt" role="group" aria-labelledby="fml">
<button data-v="p" aria-pressed="true" aria-label="Retrato" title="Retrato (832x1216)"><iconify-icon icon="lucide:rectangle-vertical" width="26" height="26"></iconify-icon></button>
<button data-v="l" aria-pressed="false" aria-label="Horizontal" title="Horizontal (1216x832)"><iconify-icon icon="lucide:rectangle-horizontal" width="26" height="26"></iconify-icon></button>
</div>
<span class="lb" id="spl">Velocidade</span>
<input type="hidden" id="speed" value="">
<div class="spd" role="group" aria-labelledby="spl">
<button data-v="" aria-pressed="true" aria-label="Completo" title="Completo: workflow original, com hires fix e tile upscale"><iconify-icon icon="lucide:gem" width="26" height="26"></iconify-icon></button>
<button data-v="fast" aria-pressed="false" aria-label="Rápido" title="Rápido: 26 steps, sem o tile upscale final"><iconify-icon icon="lucide:zap" width="26" height="26"></iconify-icon></button>
<button data-v="ultra" aria-pressed="false" aria-label="Ultra-rápido" title="Ultra-rápido: 26 steps, sem hires fix e sem tile upscale"><iconify-icon icon="lucide:fast-forward" width="26" height="26"></iconify-icon></button>
</div>
<span class="lb" id="ql">Quantidade</span>
<div class="pair qty" role="group" aria-labelledby="ql">
<button data-q="1" aria-pressed="true" title="Gerar 1 imagem">1</button>
<button data-q="3" aria-pressed="false" title="Gerar 3 imagens, cada uma com um prompt sorteado diferente">3</button>
<button data-q="6" aria-pressed="false" title="Gerar 6 imagens, cada uma com um prompt sorteado diferente">6</button>
<button data-q="12" aria-pressed="false" title="Gerar 12 imagens, cada uma com um prompt sorteado diferente">12</button>
</div>
<label class="ck"><input type="checkbox" id="keep">Manter a seed da última imagem</label>
<label class="ck"><input type="checkbox" id="auto">Enviar ao ComfyUI ao clicar em GENERATE</label>
</div></details>
<details><summary><iconify-icon icon="lucide:ban" width="18" height="18"></iconify-icon>Negativo<iconify-icon class="chev" icon="lucide:chevron-down" width="18" height="18"></iconify-icon></summary><div class="in">
<label class="lb" for="neg">Prompt negativo</label>
<textarea id="neg" rows="7" spellcheck="false"></textarea>
<div class="act"><button id="negr" type="button"><iconify-icon icon="lucide:rotate-ccw" width="18" height="18"></iconify-icon>Restaurar padrão</button></div>
<p class="hint">Vale para as próximas imagens. Fica salvo neste navegador.</p>
</div></details>
<details><summary><iconify-icon icon="lucide:plug" width="18" height="18"></iconify-icon>Conexão<iconify-icon class="chev" icon="lucide:chevron-down" width="18" height="18"></iconify-icon></summary><div class="in">
<label class="lb" for="url">Endereço do ComfyUI</label><input type="text" id="url" value="http://127.0.0.1:8188">
</div></details>
</div>
<div class="dock">
<button id="gen">GENERATE</button>
<button id="send" hidden><iconify-icon icon="lucide:send" width="18" height="18"></iconify-icon>Enviar ao ComfyUI</button>
</div>
</aside>
<main class="stage">
<div class="bar"><p id="st" role="status"></p><button id="clr" aria-label="Limpar galeria" title="Limpar galeria"><iconify-icon icon="lucide:trash-2" width="20" height="20"></iconify-icon></button><span class="cfgw"><button id="cfg" class="gear" aria-label="Configurações" aria-expanded="false" aria-controls="pop" title="Configurações"><iconify-icon icon="lucide:settings" width="20" height="20"></iconify-icon></button>
<div id="pop" role="dialog" aria-label="Configurações" hidden>
<p class="pt">Configurações</p>
<label class="ck"><input type="checkbox" id="anim">Animações (anime.js)</label>
<p class="hint" id="animnote"></p>
<label class="ck"><input type="checkbox" id="snd">Aviso sonoro ao terminar a fila</label>
<p class="hint">Dica: aperte Espaço para gerar.</p>
</div></span></div>
<section id="out" aria-live="polite">
<div class="ohead"><p id="theme"></p>
<button class="ibtn" id="copy" aria-label="Copiar prompt" title="Copiar prompt"><iconify-icon id="copyic" icon="lucide:copy" width="20" height="20"></iconify-icon></button>
<button class="ibtn" id="edit" aria-label="Editar prompt" title="Editar prompt" aria-pressed="false"><iconify-icon icon="lucide:pencil" width="20" height="20"></iconify-icon></button></div>
<textarea id="txt" hidden rows="14" spellcheck="false" aria-label="Prompt gerado"></textarea>
</section>
<div id="res"></div>
</main>
</div>

let AC=null,SND=false,DONEIMG=false,LASTFIN=0;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();[[660,0],[880,.16]].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);});}catch(e){}}
try{SND=localStorage.getItem("snd_on")==="1";}catch(e){}
$("snd").checked=SND;
$("snd").onchange=()=>{SND=$("snd").checked;try{localStorage.setItem("snd_on",SND?"1":"0");}catch(e){}if(SND)beep();};
let SENDING=0;
function kick(){if(!SENDING&&DONEIMG&&!$("res").querySelector(".sk")){DONEIMG=false;if(SND)beep();}}
new MutationObserver(kick).observe($("res"),{childList:true,subtree:true});
const durKey=sp=>"dur_"+(sp||"full");
function durAvg(sp){try{const a=JSON.parse(localStorage.getItem(durKey(sp))||"[]");return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;}catch(e){return 0;}}
function durAdd(sp,ms){try{const a=JSON.parse(localStorage.getItem(durKey(sp))||"[]");a.push(ms);localStorage.setItem(durKey(sp),JSON.stringify(a.slice(-8)));}catch(e){}}
const fmtT=ms=>{const s=Math.round(ms/1000);return s<90?s+" s":Math.round(s/60)+" min";};
function queueStatus(sp){const n=$("res").querySelectorAll(".sk").length;if(!n)return false;const a=durAvg(sp);$("st").textContent="Na fila: "+n+(n>1?" imagens":" imagem")+(a?". Estimativa: "+fmtT(a*n)+".":".");return true;}
function imgDone(card){const sn=card._snap;if(!card._t0)return;const t=Date.now();if(sn)durAdd(sn.sp||"",t-Math.max(card._t0,LASTFIN));LASTFIN=t;DONEIMG=true;queueStatus(sn&&sn.sp);}
document.addEventListener("keydown",e=>{if(e.code!=="Space"||e.repeat||!VW.hidden)return;const t=e.target,tg=t&&t.tagName;if(["INPUT","TEXTAREA","SELECT","BUTTON","SUMMARY","A"].includes(tg)||(t&&t.isContentEditable))return;e.preventDefault();$("gen").click();});
function mkCard(snap){
 const card=document.createElement("div");card.className="card";card._snap=snap;card.style.aspectRatio=snap.o==="l"?"1216/832":"832/1216";
 const sk=document.createElement("div");sk.className="sk";sk.setAttribute("aria-hidden","true");
 const xb=document.createElement("button");xb.className="x";xb.innerHTML='<iconify-icon icon="lucide:x" width="16" height="16"></iconify-icon>';xb.setAttribute("aria-label","Remover imagem");
 xb.onclick=()=>{const pid=card.dataset.pid,busy=card.querySelector(".sk");const aft=animRemove(card);card.remove();if(aft)aft();if(card._id){HIST=HIST.filter(h=>h.id!==card._id);saveH();}if(busy&&pid)cancelJob(pid);};
 card.append(sk,xb);return card;
}
function showImg(card,im){
 const u=$("url").value.replace(/\/$/,"")+"/view?"+new URLSearchParams({filename:im.filename,subfolder:im.subfolder||"",type:im.type||"output"});
 const a=document.createElement("a");a.href=u;card._u=u;a.onclick=e=>{e.preventDefault();openV(card);};const g=document.createElement("img");g.alt="Imagem gerada";a.appendChild(g);
 g.onload=()=>{const k=card.querySelector(".sk");if(k)k.replaceWith(a);animIn(card,card._d);imgDone(card);const sn=card._snap;if(sn&&!card.querySelector(".fv"))mkStar(card);
  if(sn&&sn.text&&!card.querySelector(".cp")){const c=document.createElement("button");c.className="up cp";c.type="button";c.innerHTML='<iconify-icon icon="lucide:copy" width="13" height="13"></iconify-icon>Prompt';c.title="Copiar o prompt desta imagem";c.onclick=e=>{e.stopPropagation();copyPrompt(sn,c);};card.appendChild(c);}
  if(sn&&sn.sp&&!card.querySelector(".up")){const b=document.createElement("button");b.className="up";b.innerHTML='<iconify-icon icon="lucide:maximize-2" width="13" height="13"></iconify-icon>Upscale';b.title="Refazer esta mesma imagem com hires fix e tile upscale";b.onclick=()=>send({...sn,sp:""});card.appendChild(b);}};
 g.onerror=()=>card.remove();
 g.src=u;
}
HIST.forEach((h,i)=>{const c=mkCard(h.snap);c._id=h.id;c._d=Math.min(i,12)*50;$("res").appendChild(c);showImg(c,h.im);});
$("clr").onclick=()=>{if(!confirm("Remover todas as imagens da tela?"))return;$("res").innerHTML="";HIST=[];saveH();};
async function poll(id,base,card){
 const st=$("st"),t0=Date.now();
 st.textContent="Gerando...";
 while(card.isConnected&&Date.now()-t0<600000){
  try{
   const h=await (await fetch(base+"/history/"+id)).json();
   const o=h[id]&&h[id].outputs;
   if(o){const im=((o["57"]||{}).images||[])[0]||Object.values(o).flatMap(x=>x.images||[]).pop();
    if(im){card._id=Date.now()+Math.random();HIST.unshift({id:card._id,snap:card._snap,im:{filename:im.filename,subfolder:im.subfolder||"",type:im.type||"output"}});saveH();showImg(card,im);
     if(card.isConnected)st.textContent="Pronto. Clique na imagem para abrir em tamanho real.";return;}
    if(h[id].status&&h[id].status.status_str==="error"){card.remove();st.textContent="O ComfyUI terminou com erro. Veja o console dele.";return;}}
  }catch(e){}
  await new Promise(r=>setTimeout(r,1500));
 }
 if(card.isConnected){card.remove();st.textContent="Tempo esgotado esperando a imagem. Ela pode ainda aparecer no ComfyUI.";}
}
async function cancelJob(id){
 const base=$("url").value.replace(/\/$/,""),H={"Content-Type":"application/json"};
 try{
  const q=await (await fetch(base+"/queue")).json();
  const run=(q.queue_running||[]).some(x=>x[1]===id),pend=(q.queue_pending||[]).some(x=>x[1]===id);
  if(run)await fetch(base+"/interrupt",{method:"POST",headers:H,body:JSON.stringify({prompt_id:id})});
  else if(pend)await fetch(base+"/queue",{method:"POST",headers:H,body:JSON.stringify({delete:[id]})});
  else return;
  $("st").textContent="Geração cancelada.";
 }catch(e){}
}
document.querySelectorAll(".spd button").forEach(b=>b.onclick=()=>{$("speed").value=b.dataset.v;document.querySelectorAll(".spd button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
document.querySelectorAll(".fmt button").forEach(b=>b.onclick=()=>{$("fmt").value=b.dataset.v;document.querySelectorAll(".fmt button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
$("send").onclick=()=>sendN();
$("copy").onclick=async()=>{const s=$("txt").value,ic=$("copyic");let ok=true;try{await navigator.clipboard.writeText(s);}catch(e){const t=$("txt"),h=t.hidden;t.hidden=false;t.select();ok=document.execCommand("copy");t.hidden=h;}if(ok){ic.setAttribute("icon","lucide:check");setTimeout(()=>ic.setAttribute("icon","lucide:copy"),1500);}};
$("edit").onclick=()=>{const t=$("txt");t.hidden=!t.hidden;$("edit").setAttribute("aria-pressed",String(!t.hidden));if(!t.hidden)t.focus();};
document.querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;$("race").disabled=mode==="fav";$("favp").hidden=mode!=="fav";document.querySelectorAll(".mode button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
</script>
